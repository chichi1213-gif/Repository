<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>王湘祺｜首頁封面（分區版）</title>
<style>
/* =============================
   1. 全站基礎設定
============================= */
:root{
  --ink:#604b51;
  --pink:#c9829d;
  --soft:#fff9f5;
  --accent:#eab7bd;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  color:var(--ink);
}
body{background:#fff8f7}

/* =============================
   2. 首頁 HERO 外框
============================= */
.hero{
  position:relative;
  isolation:isolate;
  min-height:680px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:90px 6vw;
  background:
    radial-gradient(circle at 82% 25%,#f8dcedaa,transparent 36%),
    radial-gradient(circle at 12% 80%,#ffdcbb99,transparent 40%),
    linear-gradient(135deg,#fffdfa,#fff3f3 56%,#f7ecfc);
}
.hero:before{
  content:'';
  position:absolute;
  inset:0;
  opacity:.19;
  background-image:radial-gradient(#cc92a5 .7px,transparent .7px);
  background-size:21px 21px;
  z-index:-3;
}

/* =============================
   3. 動態背景效果
============================= */
.glow{
  position:absolute;
  left:0;
  top:0;
  width:500px;
  height:500px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,#ffd0e6a8,#eac2ff45 38%,transparent 68%);
  filter:blur(18px);
  transform:translate(calc(var(--mx, 70vw) - 50%),calc(var(--my, 30vh) - 50%));
  transition:transform .14s ease-out;
  z-index:-1;
}
.orb{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(2px);
  animation:bob 8s ease-in-out infinite alternate;
}
.orb.one{
  height:140px;
  width:140px;
  left:-38px;
  top:8%;
  background:#f4c8cf8c;
}
.orb.two{
  height:220px;
  width:220px;
  right:-95px;
  bottom:0;
  background:#daccf46b;
  animation-delay:-3s;
}
.sparkle{
  position:absolute;
  color:#ce93a8;
  opacity:.75;
  animation:twinkle 3s ease-in-out infinite alternate;
  font-size:25px;
}
.s1{top:14%;left:22%}
.s2{bottom:17%;left:12%;animation-delay:.9s}
.s3{top:17%;right:16%;animation-delay:1.3s}

/* =============================
   4. 主內容排版
============================= */
.wrap{
  max-width:1120px;
  width:100%;
  display:grid;
  grid-template-columns:1.25fr .85fr;
  align-items:center;
  gap:clamp(25px,5vw,80px);
  position:relative;
  z-index:1;
}

/* =============================
   5. 左側文字內容
============================= */
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  color:#ae8091;
  font-size:12px;
  font-weight:750;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.eyebrow:before{
  content:'';
  width:24px;
  height:1px;
  background:#cc93a3;
}
h1{
  font-size:clamp(38px,5.4vw,74px);
  line-height:1.34;
  letter-spacing:-.05em;
  margin:20px 0 8px;
  font-weight:900;
}
h1 .name{
  background:linear-gradient(100deg,#c78197,#966eaa);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  white-space:nowrap;
}
.subtitle{
  font-size:clamp(19px,2vw,26px);
  font-weight:750;
  color:#ae7d8c;
  margin:10px 0 20px;
}
.desc{
  font-size:15px;
  line-height:2.1;
  color:#78656a;
  max-width:570px;
}
.school{
  display:inline-block;
  margin-top:14px;
  padding:8px 14px;
  border:1px solid #ead7d9;
  border-radius:99px;
  background:#ffffff80;
  color:#8b7278;
  font-size:12px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:26px;
}
.tag{
  padding:9px 15px;
  background:#ffffffa8;
  border:1px solid #f0dadf;
  border-radius:99px;
  font-size:13px;
  color:#a07886;
  box-shadow:0 4px 15px #d6a6b31a;
}

/* =============================
   6. 右側照片區
============================= */
.visual{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:420px;
  transform:translate3d(var(--shift-x,0px),var(--shift-y,0px),0);
  transition:transform .2s ease-out;
}
.photo-ring{
  width:min(100%,385px);
  aspect-ratio:1;
  border-radius:47% 53% 55% 45%/48% 46% 54% 52%;
  background:linear-gradient(130deg,#f1b8c8,#d6bce7 70%,#f6d0a8);
  padding:12px;
  box-shadow:0 30px 75px #b58da43a;
  animation:morph 12s ease-in-out infinite alternate;
}
.photo{
  width:100%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(145deg,#fff9f3,#faeaf2);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  border:8px solid #ffffffbc;
}
.photo img{
  height:100%;
  width:100%;
  object-fit:cover;
  object-position:50% 68%;
}
.photo-placeholder{
  text-align:center;
  color:#ad8492;
  font-size:14px;
  line-height:1.9;
  padding:20px;
}
.photo-placeholder .icon{
  font-size:64px;
  display:block;
  margin-bottom:10px;
}
.sticker{
  position:absolute;
  background:#fffdfae8;
  border:1px solid #f3e4e7;
  border-radius:17px;
  padding:11px 15px;
  box-shadow:0 10px 28px #6c3f4b18;
  font-size:13px;
  color:#9f7483;
}
.sticker.top{
  right:-15px;
  top:42px;
  transform:rotate(8deg);
}
.sticker.bottom{
  left:-8px;
  bottom:48px;
  transform:rotate(-8deg);
}

/* 照片整組向下移動 38px，保留滑鼠互動效果 */
.visual{margin-top:38px}
@media(max-width:790px){.visual{margin-top:14px}}

/* =============================
   7. 頁尾小字
============================= */
.foot{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  letter-spacing:.16em;
  color:#ad8e97;
  opacity:.9;
}

/* =============================
   8. 動畫
============================= */
@keyframes bob{to{transform:translate(18px,-26px)}}
@keyframes twinkle{to{opacity:.24;transform:scale(.8) rotate(15deg)}}
@keyframes morph{to{border-radius:53% 47% 45% 55%/44% 55% 45% 56%}}

/* =============================
   9. 手機版
============================= */
@media(max-width:790px){
  .hero{padding:70px 22px 66px;min-height:700px}
  .wrap{grid-template-columns:1fr;text-align:center;gap:20px}
  .eyebrow{justify-content:center}
  .desc{margin-inline:auto}
  .tags{justify-content:center}
  .visual{min-height:310px}
  .photo-ring{max-width:280px}
  .sticker.top{right:2%}
  .sticker.bottom{left:2%;bottom:14px}
  .foot{bottom:15px;white-space:nowrap;font-size:9px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>
/* =============================
   10. 滑鼠移動互動效果
============================= */
(()=>{
  const hero=document.querySelector('.hero');
  const visual=document.querySelector('.visual');
  if(!hero||!visual) return;

  hero.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch') return;
    const rect=hero.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    hero.style.setProperty('--mx',x+'px');
    hero.style.setProperty('--my',y+'px');
    visual.style.setProperty('--shift-x',((x/rect.width-.5)*13)+'px');
    visual.style.setProperty('--shift-y',((y/rect.height-.5)*13)+'px');
  });

  hero.addEventListener('pointerleave',()=>{
    visual.style.setProperty('--shift-x','0px');
    visual.style.setProperty('--shift-y','0px');
  });
})();
</script>
